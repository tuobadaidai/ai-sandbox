<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 沙盒行为洞察系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== 入口页 ==================== -->
  <div id="view-entry" class="view entry-view active">
    <div class="entry-card">
      <h1>AI 沙盒行为洞察系统</h1>
      <p>通过实战任务评估候选人的 AI 协同能力</p>

      <div id="entry-form" style="display:block">
        <div class="form-group">
          <label>候选人姓名</label>
          <input type="text" class="form-input" id="input-name" placeholder="请输入姓名">
        </div>
        <div class="form-group">
          <label>邮箱（可选）</label>
          <input type="email" class="form-input" id="input-email" placeholder="选填">
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="startSandbox()">进入沙盒</button>
      </div>

      <div id="entry-loading" style="display:none;text-align:center;padding:20px">
        <div style="color:var(--text-accent)">正在准备沙盒环境...</div>
      </div>
    </div>

    <div class="entry-links">
      <a href="#admin">管理后台</a>
    </div>
  </div>

  <!-- ==================== 沙盒主页 ==================== -->
  <div id="view-sandbox" class="view">
    <div class="app-container">
      <!-- 顶栏 -->
      <div class="top-bar">
        <div style="display:flex;align-items:center;gap:16px">
          <span class="top-bar-logo">AI SANDBOX</span>
          <div class="stage-indicator">
            <div class="stage-dot" id="stage-dot-1"></div>
            <div class="stage-dot" id="stage-dot-2"></div>
            <div class="stage-dot" id="stage-dot-3"></div>
          </div>
          <span id="stage-label" style="font-size:13px;color:var(--text-secondary)"></span>
        </div>
        <div class="top-bar-info">
          <span id="candidate-name-display"></span>
          <div class="timer" id="timer">00:00</div>
        </div>
      </div>

      <!-- 主体 -->
      <div class="main-content">
        <!-- 左侧任务面板 -->
        <div class="task-panel">
          <div class="task-header">
            <div class="stage-name" id="task-stage-name"></div>
            <h2 id="task-title"></h2>
          </div>
          <div class="task-body" id="task-body">
            <!-- 公司背景资料面板 -->
            <div id="company-bg-panel" class="company-bg-panel">
              <div class="company-bg-header" onclick="toggleCompanyBg()">
                <span>公司背景资料</span>
                <span class="company-bg-toggle" id="company-bg-toggle">▼</span>
              </div>
              <div class="company-bg-body" id="company-bg-body">
                <div style="text-align:center;padding:12px;color:var(--text-muted);">等待加载数据...</div>
              </div>
            </div>

            <!-- 候选人角色面板 -->
            <div id="candidate-context-panel" class="context-panel" style="display:none;margin-bottom:16px"></div>
            
            <!-- 公文筐文档面板 -->
            <div id="inbasket-panel" class="inbasket-panel" style="display:none;margin-bottom:16px">
              <div style="font-weight:bold;margin-bottom:12px;">📥 公文筐邮件</div>
              <div class="inbox-tabs" id="inbox-tabs"></div>
              <div class="inbox-content" id="inbox-content"></div>
            </div>
            
            <div class="task-description" id="task-description"></div>
          </div>
        </div>

        <!-- 右侧工作区 -->
        <div class="work-panel">
          <!-- AI 聊天区 -->
          <div class="chat-area">
            <div class="chat-messages" id="chat-messages">
              <!-- 消息将在这里动态添加 -->
            </div>
            <div class="chat-input-area">
              <textarea class="chat-input" id="chat-input" placeholder="输入你的问题，按 Enter 发送..." rows="1"></textarea>
              <button class="btn btn-primary send-btn" id="send-btn" onclick="handleSend()">发送</button>
            </div>
          </div>

          <!-- 编辑区 -->
          <div class="editor-panel">
            <div class="editor-header">
              <h3 id="editor-stage-title">你的分析文档</h3>
              <div style="display:flex;gap:8px">
                <span id="char-count" style="font-size:12px;color:var(--text-muted);line-height:34px">0 字</span>
                <button class="btn btn-primary" id="btn-submit-stage" style="padding:6px 16px;font-size:13px" onclick="submitCurrentStage()">提交本阶段</button>
                <button class="btn btn-danger" style="padding:6px 16px;font-size:13px" onclick="submitTask()">提交全部任务</button>
              </div>
            </div>
            <div class="editor-body">
              <textarea class="editor-textarea" id="editor-textarea" placeholder="在这里整理你的分析和方案...&#10;&#10;你可以把 AI 助手返回的内容粘贴到这里进行编辑和整理。"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 管理后台 ==================== -->
  <div id="view-admin" class="view admin-view">
    <div class="admin-header">
      <h1>管理后台</h1>
      <button class="btn btn-ghost" onclick="location.hash=''">返回入口</button>
    </div>

    <!-- 登录 -->
    <div id="admin-login" style="max-width:400px;margin:60px auto;padding:40px">
      <h2 style="margin-bottom:16px">请输入管理密码</h2>
      <div class="form-group">
        <input type="password" class="form-input" id="admin-secret-input" placeholder="管理密码">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="adminLogin()">进入后台</button>
    </div>

    <!-- 候选人列表 -->
    <div id="admin-list">
      <div class="admin-body">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
          <h2>候选人列表</h2>
          <button class="btn btn-ghost btn-sm" onclick="refreshCandidateList()">刷新</button>
        </div>
        <div id="candidate-list-container"></div>
      </div>
    </div>

    <!-- 候选人详情 -->
    <div id="admin-detail">
      <div class="report-header">
        <button class="btn btn-ghost" onclick="showAdminList()">&#8592; 返回列表</button>
        <h1 id="detail-title">行为详情</h1>
      </div>
      <div class="admin-body" id="detail-container"></div>
    </div>

    <!-- 报告页 -->
    <div id="admin-report" style="display:none;flex-direction:column;height:100%">
      <div class="report-header">
        <button class="btn btn-ghost" onclick="showAdminList()">&#8592; 返回列表</button>
        <h1>评估报告</h1>
      </div>
      <div id="report-container" style="flex:1;overflow-y:auto;padding:24px"></div>
    </div>
  </div>

  <!-- ==================== 完成页 ==================== -->
  <div id="view-complete" class="view">
    <div style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;width:100%;height:100vh;text-align:center;padding:20px;">
      <div style="font-size:64px;color:var(--success);">✓</div>
      <h1 style="font-size:28px;color:var(--text-primary);margin:0;">任务已完成</h1>
      <p style="color:var(--text-secondary);font-size:16px;margin:0;">感谢你的参与！评估团队将分析你的表现。</p>
    </div>
  </div>

  <!-- ==================== 突发事件弹窗 ==================== -->
  <div class="overlay" id="event-overlay"></div>
  <div class="event-popup" id="event-popup">
    <div class="event-popup-header" id="popup-title"></div>
    <div class="event-popup-body" id="popup-body"></div>
    <div class="event-popup-footer">
      <button class="btn btn-primary" onclick="closePopup()">我知道了</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/sandbox.js"></script>
  <script src="js/ai-chat.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // ==================== 全局状态 ====================
    let API_BASE = window.location.origin;
    let currentToken = null;
    let taskConfig = null;
    let timerInterval = null;
    let stageTimers = [];
    let currentStage = 1;
    let stageContents = {}; // 保存每个阶段的内容
    let docContents = {}; // 保存每个文档的内容 {stage_num: {doc_id: content}}
    let currentDocId = null; // 当前选中的文档ID
    let companyBgExpanded = true; // 公司背景面板是否展开

    // ==================== 路由 ====================
    function route() {
      const hash = location.hash;

      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      if (hash.startsWith('#admin')) {
        document.getElementById('view-admin').classList.add('active');
      } else {
        document.getElementById('view-entry').classList.add('active');
      }
    }

    window.addEventListener('hashchange', route);
    route();

    // ==================== 沙盒入口 ====================
    async function startSandbox() {
      const name = document.getElementById('input-name').value.trim();
      if (!name) {
        showToast('请输入姓名');
        return;
      }

      document.getElementById('entry-form').style.display = 'none';
      document.getElementById('entry-loading').style.display = 'block';

      try {
        // 1. 创建候选人
        const resp = await fetch(`${API_BASE}/api/candidates`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            email: document.getElementById('input-email').value.trim() || null
          })
        });

        if (!resp.ok) throw new Error('创建失败');
        const candidate = await resp.json();
        currentToken = candidate.token;

        // 2. 获取沙盒配置
        const sandboxResp = await fetch(`${API_BASE}/api/sandbox/${currentToken}`);
        if (!sandboxResp.ok) throw new Error('进入沙盒失败');
        const sandbox = await sandboxResp.json();
        taskConfig = sandbox.task;
        // 防御性清理：确保候选人前端不包含评估维度信息
        if (taskConfig && taskConfig.stages) {
          taskConfig.stages.forEach(s => { delete s.evaluation_focus; });
        }
        // 加载已有的阶段提交
        if (sandbox.stage_submissions) {
          stageContents = { ...sandbox.stage_submissions };
        }

        // 3. 初始化 tracker 和 AI chat
        window.tracker = new BehaviorTracker(sandbox.candidate_id, sandbox.session_id);
        window.tracker.setToken(currentToken);

        window.aiChat = new AIChat(document.getElementById('view-sandbox'), window.tracker);
        window.aiChat.setToken(currentToken);

        // 4. 切换到沙盒视图
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-sandbox').classList.add('active');

        document.getElementById('candidate-name-display').textContent = sandbox.candidate_name;

        // 渲染候选人上下文
        renderCandidateContext(taskConfig.candidate_context);

        // 5. 加载第一阶段任务
        loadStage(1);

        // 6. 开始计时
        startTimer();

        // 7. 设置阶段计时器
        setupStageTimers();

        // 8. 记录任务开始
        window.tracker.track('TASK_START');

        // 9. 绑定编辑器事件
        setupEditorTracking();

        // 10. 绑定聊天输入
        setupChatInput();

      } catch (e) {
        document.getElementById('entry-form').style.display = 'block';
        document.getElementById('entry-loading').style.display = 'none';
        showToast('启动失败: ' + e.message);
      }
    }

    // ==================== 任务阶段管理 ====================
    function loadStage(stageNum) {
      const stage = taskConfig.stages[stageNum - 1];
      if (!stage) return;

      // 切换阶段前保存
      const textarea = document.getElementById('editor-textarea');
      if (textarea && currentStage !== stageNum) {
        // 如果有公文筐文档，保存当前文档内容
        if (currentDocId && docContents[currentStage]) {
          docContents[currentStage][currentDocId] = textarea.value;
        }
        // 也保存到阶段内容作为备份
        stageContents[currentStage] = textarea.value;
      }

      currentStage = stageNum;
      currentDocId = null; // 将在 renderInbasketDocuments 中重新设定

      // 加载新阶段的内容
      if (textarea) {
        // 如果有公文筐文档，内容由 loadDocEditorContent 设置
        // 否则使用 stageContents
        var hasDocs = stage.inbasket_documents && Array.isArray(stage.inbasket_documents) && stage.inbasket_documents.length > 0;
        if (!hasDocs) {
          textarea.value = stageContents[stageNum] || '';
          var charCount = document.getElementById('char-count');
          if (charCount) charCount.textContent = (textarea.value.length || 0) + ' 字';
        }
      }

      // 更新编辑器标题
      var editorTitle = document.getElementById('editor-stage-title');
      if (editorTitle) editorTitle.textContent = 'Stage ' + stageNum + ': ' + stage.name;

      // 更新 UI
      document.getElementById('task-stage-name').textContent = 'Stage ' + stage.id;
      document.getElementById('task-title').textContent = stage.name;
      document.getElementById('task-description').innerHTML = formatDescription(stage.description);
      
      document.getElementById('stage-label').textContent = stage.name;
      
      // 渲染公文筐文档（里面会调用 loadDocEditorContent）
      renderInbasketDocuments(stage.inbasket_documents);

      // 更新阶段指示器
      for (var i = 1; i <= 3; i++) {
        var dot = document.getElementById('stage-dot-' + i);
        dot.classList.remove('active', 'completed');
        if (i < stageNum) dot.classList.add('completed');
        if (i === stageNum) dot.classList.add('active');
      }

      // 更新 tracker 和 AI chat 的阶段
      window.tracker.setStage(stageNum);
      window.aiChat.setStage(stageNum);

      // 添加系统消息（仅在首次进入时添加）
      if (!stageContents[stageNum]) {
        window.aiChat.appendMessage('system', '=== Stage ' + stageNum + ': ' + stage.name + ' ===\n\n' + stage.description);
      }
    }

    function formatDescription(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^>\s*(.+)$/gm, '<blockquote>$1</blockquote>')
        .replace(/\n/g, '<br>');
    }

    // 渲染候选人上下文 + 公司背景资料
    function renderCandidateContext(context) {
      try {
        // 角色面板
        var panel = document.getElementById('candidate-context-panel');
        if (panel && context) {
          var html = '<div class="context-title">&#127917; 您的角色</div>';
          if (context.role) {
            html += '<div class="context-role">' + context.role + '</div>';
          }
          if (context.reporting_line) {
            html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:2px;">' + context.reporting_line + '</div>';
          }
          if (context.tenure) {
            html += '<div style="font-size:12px;color:var(--text-muted);">' + context.tenure + '</div>';
          }
          panel.innerHTML = html;
          panel.style.display = 'block';
        }

        // 公司背景资料面板
        var bgPanel = document.getElementById('company-bg-panel');
        var bgBody = document.getElementById('company-bg-body');
        if (!bgPanel || !bgBody) { console.log('company-bg-panel elements not found'); return; }
        if (!context) { console.log('context is null'); return; }
        var cp = context.company_profile;
        if (!cp) { console.log('company_profile is null'); return; }

        var bgHtml = '';
        
        // 关键指标
        if (cp.key_metrics) {
          bgHtml += '<div class="company-bg-section"><div class="company-bg-label">&#128202; 关键数据</div>';
          bgHtml += '<div class="company-bg-metrics">';
          var metrics = cp.key_metrics;
          var keys = Object.keys(metrics);
          for (var i = 0; i < keys.length; i++) {
            var key = keys[i];
            var label = key.replace(/_/g, ' ');
            bgHtml += '<div class="company-bg-metric"><div class="company-bg-metric-label">' + label + '</div><div class="company-bg-metric-value">' + metrics[key] + '</div></div>';
          }
          bgHtml += '</div></div>';
        }
        
        // 商业模式
        if (cp.business_model) {
          bgHtml += '<div class="company-bg-section"><div class="company-bg-label">&#128188; 商业模式</div><div class="company-bg-text">' + cp.business_model + '</div></div>';
        }
        
        // 组织架构
        if (cp.org_structure) {
          bgHtml += '<div class="company-bg-section"><div class="company-bg-label">&#127959; 组织架构</div><div class="company-bg-text">' + cp.org_structure + '</div></div>';
        }
        
        // 战略矛盾
        if (cp.strategic_tensions && cp.strategic_tensions.length > 0) {
          bgHtml += '<div class="company-bg-section"><div class="company-bg-label">&#9889; 战略矛盾</div><ul class="company-bg-list">';
          for (var j = 0; j < cp.strategic_tensions.length; j++) {
            bgHtml += '<li>' + cp.strategic_tensions[j] + '</li>';
          }
          bgHtml += '</ul></div>';
        }
        
        // 近期事件
        if (cp.recent_events && cp.recent_events.length > 0) {
          bgHtml += '<div class="company-bg-section"><div class="company-bg-label">&#128197; 近期关键事件</div><ul class="company-bg-list">';
          for (var k = 0; k < cp.recent_events.length; k++) {
            bgHtml += '<li>' + cp.recent_events[k] + '</li>';
          }
          bgHtml += '</ul></div>';
        }
        
        // 关键人物
        if (context.key_relationships && context.key_relationships.length > 0) {
          bgHtml += '<div class="company-bg-section"><div class="company-bg-label">&#128101; 关键人物</div>';
          for (var m = 0; m < context.key_relationships.length; m++) {
            var p = context.key_relationships[m];
            bgHtml += '<div style="margin-bottom:8px;"><span style="font-weight:600;color:var(--text-primary);">' + p.person + '</span><br><span style="font-size:12px;color:var(--text-muted);">' + p.stance + '</span></div>';
          }
          bgHtml += '</div>';
        }
        
        bgBody.innerHTML = bgHtml;
      } catch (e) {
        console.error('renderCandidateContext error:', e);
        var bgBody2 = document.getElementById('company-bg-body');
        if (bgBody2) {
          bgBody2.innerHTML = '<div style="padding:16px;color:#e74c3c;background:rgba(231,76,60,0.1);border-radius:4px;">&#9888; 公司背景资料加载失败: ' + e.message + '</div>';
        }
      }
    }

    function toggleCompanyBg() {
      companyBgExpanded = !companyBgExpanded;
      var body = document.getElementById('company-bg-body');
      var toggle = document.getElementById('company-bg-toggle');
      if (companyBgExpanded) {
        body.style.display = 'block';
        toggle.classList.remove('collapsed');
      } else {
        body.style.display = 'none';
        toggle.classList.add('collapsed');
      }
    }

    // 渲染公文筐文档
    function renderInbasketDocuments(documents) {
      const panel = document.getElementById('inbasket-panel');
      const tabsDiv = document.getElementById('inbox-tabs');
      
      if (!panel || !documents || !Array.isArray(documents) || documents.length === 0) {
        if (panel) panel.style.display = 'none';
        currentDocId = null;
        return;
      }
      
      // 确保该阶段的文档内容存储存在
      if (!docContents[currentStage]) {
        docContents[currentStage] = {};
      }

      // 确定默认选中的文档
      var activeId = currentDocId;
      if (!activeId || !documents.find(function(d) { return d.id === activeId; })) {
        activeId = documents[0].id;
      }
      currentDocId = activeId;
      
      // 渲染标签页
      var tabsHtml = '';
      for (var idx = 0; idx < documents.length; idx++) {
        var doc = documents[idx];
        var senderLabel = doc.sender || ('邮件 ' + (idx + 1));
        var activeClass = doc.id === currentDocId ? ' active' : '';
        var hasContent = docContents[currentStage][doc.id] ? ' 📝' : '';
        tabsHtml += '<div class="inbox-tab' + activeClass + '" data-doc-id="' + doc.id + '">' + senderLabel + hasContent + '</div>';
      }
      tabsDiv.innerHTML = tabsHtml;
      
      // 渲染当前文档
      var activeDoc = documents.find(function(d) { return d.id === currentDocId; });
      if (activeDoc) renderInbasketDoc(activeDoc);
      
      // 加载当前文档的编辑器内容
      loadDocEditorContent(currentDocId);
      
      // 绑定点击事件
      var allTabs = tabsDiv.querySelectorAll('.inbox-tab');
      allTabs.forEach(function(tab) {
        tab.onclick = function(e) {
          var docId = e.target.getAttribute('data-doc-id');
          // 保存当前文档内容
          saveDocEditorContent(currentDocId);
          // 更新选中状态
          currentDocId = docId;
          allTabs.forEach(function(t) { t.classList.remove('active'); });
          e.target.classList.add('active');
          // 显示对应文档
          var selDoc = documents.find(function(d) { return d.id === docId; });
          if (selDoc) renderInbasketDoc(selDoc);
          // 加载该文档的编辑器内容
          loadDocEditorContent(docId);
        };
      });
      
      panel.style.display = 'block';
    }
    
    function renderInbasketDoc(doc) {
      const contentDiv = document.getElementById('inbox-content');
      if (!contentDiv) return;
      
      var html = '';
      if (doc.sender) {
        html += '<div class="inbox-doc-sender">' + doc.sender + '</div>';
      }
      if (doc.subject) {
        html += '<div class="inbox-doc-subject">' + doc.subject + '</div>';
      }
      if (doc.date || doc.time) {
        var metaParts = [];
        if (doc.date) metaParts.push(doc.date);
        if (doc.time) metaParts.push(doc.time);
        html += '<div class="inbox-doc-meta">' + metaParts.join(' ') + '</div>';
      }
      if (doc.content) {
        html += '<div class="inbox-doc-content">' + formatDescription(doc.content) + '</div>';
      }
      // 指示当前正在编辑此文档
      html += '<div style="margin-top:10px;padding:6px 10px;background:var(--accent-dim);border-radius:var(--radius-sm);font-size:12px;color:var(--text-accent);">✏️ 右侧编辑器当前对应此邮件 — 请撰写你的回复/分析方案</div>';
      
      contentDiv.innerHTML = html;
    }

    function saveDocEditorContent(docId) {
      if (!docId) return;
      if (!docContents[currentStage]) docContents[currentStage] = {};
      var textarea = document.getElementById('editor-textarea');
      docContents[currentStage][docId] = textarea ? textarea.value : '';
    }

    function loadDocEditorContent(docId) {
      if (!docId) return;
      if (!docContents[currentStage]) docContents[currentStage] = {};
      var textarea = document.getElementById('editor-textarea');
      if (textarea) {
        textarea.value = docContents[currentStage][docId] || '';
        var charCount = document.getElementById('char-count');
        if (charCount) charCount.textContent = (textarea.value.length || 0) + ' 字';
      }
      // 更新编辑器标题
      var editorTitle = document.getElementById('editor-stage-title');
      var stage = taskConfig.stages[currentStage - 1];
      if (editorTitle && stage) {
        var doc = stage.inbasket_documents ? stage.inbasket_documents.find(function(d) { return d.id === docId; }) : null;
        var docLabel = doc ? ' — ' + (doc.sender || doc.subject || '') : '';
        editorTitle.textContent = 'Stage ' + currentStage + ': ' + stage.name + docLabel;
      }
    }

    function setupStageTimers() {
      stageTimers.forEach(t => clearTimeout(t));
      stageTimers = [];

      taskConfig.stages.forEach((stage, index) => {
        if (index === 0) return; // 第一阶段是开始时加载的

        const autoTrigger = stage.auto_trigger_minutes;
        if (autoTrigger) {
          // 自动触发突发事件（从任务开始算）
          const timer = setTimeout(() => {
            if (currentStage >= index + 1) return; // 已经进入更后阶段
            showEventPopup(stage.trigger_message, stage.name, index + 1);
          }, autoTrigger * 60 * 1000);
          stageTimers.push(timer);
        }
      });

      // 阶段结束提醒
      let accumMinutes = 0;
      taskConfig.stages.forEach((stage, index) => {
        accumMinutes += stage.duration_minutes;
        const warningTime = accumMinutes - (taskConfig.time_warning_minutes || 2);
        if (warningTime > 0) {
          const timer = setTimeout(() => {
            if (currentStage === index + 1) {
              window.aiChat.appendMessage('system', `⏰ Stage ${index + 1} 还剩 ${taskConfig.time_warning_minutes || 2} 分钟`);
            }
          }, warningTime * 60 * 1000);
          stageTimers.push(timer);
        }
      });
    }

    // ==================== 突发事件弹窗 ====================
    function showEventPopup(message, title, nextStage) {
      document.getElementById('popup-title').textContent = title || '突发事件';
      document.getElementById('popup-body').textContent = message;
      document.getElementById('event-overlay').classList.add('show');
      document.getElementById('event-popup').classList.add('show');

      // 关闭弹窗后切换到下一阶段
      document.getElementById('event-popup')._nextStage = nextStage;
    }

    function closePopup() {
      document.getElementById('event-overlay').classList.remove('show');
      document.getElementById('event-popup').classList.remove('show');

      const nextStage = document.getElementById('event-popup')._nextStage;
      if (nextStage && nextStage !== currentStage) {
        loadStage(nextStage);
      }
    }

    // ==================== 计时器 ====================
    function startTimer() {
      const timerEl = document.getElementById('timer');
      const totalMinutes = taskConfig.total_duration_minutes;

      timerInterval = setInterval(() => {
        if (!window.tracker) return;
        const elapsed = window.tracker.getElapsedSeconds();
        const remaining = totalMinutes * 60 - elapsed;

        if (remaining <= 0) {
          clearInterval(timerInterval);
          timerEl.textContent = '00:00';
          timerEl.classList.add('danger');
          showToast('时间到！请提交你的任务。');
          return;
        }

        const minutes = Math.floor(remaining / 60);
        const seconds = remaining % 60;
        timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        timerEl.classList.remove('warning', 'danger');
        if (remaining <= 120) timerEl.classList.add('danger');
        else if (remaining <= 300) timerEl.classList.add('warning');
      }, 1000);
    }

    // ==================== 聊天输入 ====================
    function setupChatInput() {
      const input = document.getElementById('chat-input');
      const btn = document.getElementById('send-btn');

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      input.addEventListener('input', () => {
        // 自动调整高度
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      });
    }

    function handleSend() {
      if (!currentToken) {
        showToast('会话已过期，请重新进入沙盒');
        return;
      }

      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      window.aiChat.queueMessage(text);
      input.value = '';
      input.style.height = 'auto';
    }

    // ==================== 编辑器追踪 ====================
    function setupEditorTracking() {
      const textarea = document.getElementById('editor-textarea');
      const charCount = document.getElementById('char-count');

      let lastLength = 0;
      let inputDebounce = null;

      textarea.addEventListener('input', () => {
        const len = textarea.value.length;
        charCount.textContent = len + ' 字';

        // 防抖记录文本输入事件
        clearTimeout(inputDebounce);
        inputDebounce = setTimeout(() => {
          if (Math.abs(len - lastLength) > 5) {
            window.tracker.trackTextInput(textarea.value.substring(0, 200), 'editor');
          }
          lastLength = len;
        }, 500);
      });

      // 复制粘贴检测
      textarea.addEventListener('paste', () => {
        window.tracker.trackCopyPaste('paste', textarea.value.length);
      });

      textarea.addEventListener('copy', () => {
        window.tracker.trackCopyPaste('copy', textarea.value.length);
      });

      // Tab 键插入缩进
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start + 2;
          // 触发 input 事件更新字数统计
          textarea.dispatchEvent(new Event('input', { bubbles: true }));
          if (window.tracker) {
            window.tracker.track('TAB_INSERT', { position: start });
          }
        }
      });
    }

    // ==================== 提交当前阶段 ====================
    async function submitCurrentStage() {
      if (!currentToken) {
        showToast('会话已过期，请重新进入沙盒');
        return;
      }

      // 先保存当前文档内容
      saveDocEditorContent(currentDocId);

      // 收集该阶段所有文档的内容
      var stageAllContent = '';
      var stage = taskConfig.stages[currentStage - 1];
      if (stage && stage.inbasket_documents && stage.inbasket_documents.length > 0) {
        // 有文档的阶段：合并所有文档内容
        var parts = [];
        stage.inbasket_documents.forEach(function(doc) {
          var content = docContents[currentStage] && docContents[currentStage][doc.id] ? docContents[currentStage][doc.id] : '';
          if (content.trim()) {
            parts.push('## ' + (doc.sender || doc.subject || doc.id) + '\n\n' + content);
          }
        });
        stageAllContent = parts.join('\n\n---\n\n');
      } else {
        // 无文档的阶段：使用编辑器内容
        var textarea = document.getElementById('editor-textarea');
        stageAllContent = textarea ? textarea.value : '';
      }

      if (!stageAllContent.trim()) {
        showToast('请先为当前阶段撰写内容');
        return;
      }

      if (!confirm('确认提交 Stage ' + currentStage + ' 的内容？提交后可以随时修改。')) return;

      try {
        const resp = await fetch(API_BASE + '/api/stages/submit/' + currentToken, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Token': currentToken
          },
          body: JSON.stringify({
            stage: currentStage,
            content: stageAllContent
          })
        });

        if (!resp.ok) throw new Error('提交失败');

        stageContents[currentStage] = stageAllContent;
        showToast('Stage ' + currentStage + ' 已提交保存！');
      } catch (e) {
        showToast('提交失败: ' + e.message);
      }
    }

    // ==================== 提交任务 ====================
    async function submitTask() {
      if (!currentToken) {
        showToast('会话已过期，请重新进入沙盒');
        return;
      }

      // 保存当前文档和阶段内容
      saveDocEditorContent(currentDocId);
      var textarea = document.getElementById('editor-textarea');
      stageContents[currentStage] = textarea ? textarea.value : '';

      // 构建完整的最终产出
      var finalParts = [];
      for (var s = 1; s <= taskConfig.stages.length; s++) {
        var stage = taskConfig.stages[s - 1];
        if (docContents[s] && Object.keys(docContents[s]).length > 0) {
          // 有文档内容的阶段
          var docParts = [];
          if (stage.inbasket_documents) {
            stage.inbasket_documents.forEach(function(doc) {
              var c = docContents[s][doc.id] || '';
              if (c.trim()) {
                docParts.push('### ' + (doc.sender || doc.subject || doc.id) + '\n\n' + c);
              }
            });
          }
          if (docParts.length > 0) {
            finalParts.push('## Stage ' + s + ': ' + stage.name + '\n\n' + docParts.join('\n\n---\n\n'));
          }
        } else if (stageContents[s]) {
          finalParts.push('## Stage ' + s + ': ' + stage.name + '\n\n' + stageContents[s]);
        }
      }
      var finalOutput = finalParts.join('\n\n');

      if (!confirm('确认提交全部任务？提交后无法修改。')) return;

      window.tracker.track('TASK_SUBMIT', {
        final_output_length: finalOutput.length
      });

      try {
        const resp = await fetch(API_BASE + '/api/submit/' + currentToken, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Token': currentToken
          },
          body: JSON.stringify({
            final_output: finalOutput
          })
        });

        if (!resp.ok) throw new Error('提交失败');

        window.tracker.stopFlushing();
        clearInterval(timerInterval);

        // 隐藏所有 view，显示完成页
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-complete').classList.add('active');

      } catch (e) {
        showToast('提交失败: ' + e.message);
      }
    }

    // ==================== 管理后台 ====================
    function showAdminPanel(panelId) {
      ['admin-list', 'admin-detail', 'admin-report'].forEach(function(id) {
        document.getElementById(id).classList.remove('admin-panel-active');
      });
      // 重置 admin-report 的内联 display 样式，否则会覆盖 CSS class
      var reportEl = document.getElementById('admin-report');
      if (reportEl && panelId !== 'admin-report') {
        reportEl.style.display = 'none';
      }
      document.getElementById(panelId).classList.add('admin-panel-active');
    }

    async function adminLogin() {
      const secret = document.getElementById('admin-secret-input').value;
      if (!secret) return;

      const ok = await window.admin.login(secret);
      if (ok) {
        document.getElementById('admin-login').style.display = 'none';
        await refreshCandidateList();
      } else {
        showToast('密码错误');
      }
    }

    async function refreshCandidateList() {
      try {
        const candidates = await window.admin.getCandidates();
        showAdminPanel('admin-list');
        window.admin.renderCandidateList(candidates, document.getElementById('candidate-list-container'));
      } catch (e) {
        showToast('获取列表失败: ' + e.message);
      }
    }

    function showAdminList() {
      refreshCandidateList();
    }

    async function viewDetail(candidateId) {
      try {
        const data = await window.admin.getCandidateDetail(candidateId);
        showAdminPanel('admin-detail');
        document.getElementById('detail-title').textContent = '行为详情 - ' + data.candidate.name;
        window.admin.renderEventDetail(data, document.getElementById('detail-container'));
      } catch (e) {
        showToast('获取详情失败: ' + e.message);
      }
    }

    async function triggerEvaluate(candidateId, name) {
      if (!confirm(`确认评估候选人「${name}」？`)) return;
      try {
        const result = await window.admin.evaluateCandidate(candidateId);
        showToast(`评估完成！级别: ${result.level}，综合得分: ${result.comprehensive_score}/16`);
        await refreshCandidateList();
      } catch (e) {
        showToast('评估失败: ' + e.message);
      }
    }

    async function viewReport(candidateId) {
      try {
        const data = await window.admin.getReport(candidateId);
        document.getElementById('admin-report').style.display = 'flex';
        showAdminPanel('admin-report');
        window.admin.renderReport(data, document.getElementById('report-container'));
      } catch (e) {
        showToast('获取报告失败: ' + e.message);
      }
    }

    // 将函数暴露到全局作用域，供 onclick 调用
    window.adminLogin = adminLogin;
    window.refreshCandidateList = refreshCandidateList;
    window.showAdminList = showAdminList;
    window.viewDetail = viewDetail;
    window.triggerEvaluate = triggerEvaluate;
    window.viewReport = viewReport;
    window.showToast = showToast;

    // ==================== 工具函数 ====================
    function showToast(message) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
